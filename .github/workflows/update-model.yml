name: Refresh sector ETF model

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  refresh-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automatic refresh
        run: python final_sector_rotation_model/production_refresh.py auto --no-backup

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final_sector_rotation_model/data final_sector_rotation_model/outputs sector_etf_streamlit_app/data
          git diff --staged --quiet || git commit -m "Refresh ETF model outputs"
          git push

